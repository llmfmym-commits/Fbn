name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: unzip -o TabdilgarAsnad.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore (only if secrets are configured)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tabdilgar-asnad/app/release.keystore

      - name: Build debug APK
        working-directory: tabdilgar-asnad
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed, only if secrets are configured)
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: tabdilgar-asnad
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tabdilgar-asnad/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: tabdilgar-asnad/app/build/outputs/apk/release/*.apk
